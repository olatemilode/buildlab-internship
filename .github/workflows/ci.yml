name: CI/CD

on:
  push:
   branches: 
      - main
  pull_request:
   branches:
      - main

env:
  AWS_REGION: eu-north-1
  ECR_REPOSITORY: node-express-app
  ECS_CLUSTER: node-expresss-app
  ECS_SERVICE: node-expresss-task-service-l77u36ai
  ECS_TASK_DEFINITION_FAMILY: node-express-task
  CONTAINER_NAME: node-express-app

jobs:
  build: 
    runs-on: ubuntu-latest

    steps: 
      - name: Checkout code
        uses: actions/checkout@4

    steps: 
      - name: Set up Node.js
        uses: actions/setup-node@4
        with:
          node-version: '18'

      - name: Install dependecies
        run: npm install

      - name: Build check
        run: node --check app.js

      - name: Verify app starts successfully
        run: |
          node app.js &
          sleep 3
          curl --fail htttp://localhost:3002 || (cat app.log && exit 1)

deploy:
  needs: build
  if: github.ref == 'refs/heads/main' && github.event_name == 'push'
  runs-on: ubuntu-latest

  steps:
    - name: Checkout code
      uses: actions/checkout@v4
   
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Build, tag and push image to ECR
      id: build-image
      env:
        ECR_REGISTRY: ${{ steps.login.ecr.outputs.registry }}
        IMAGE_TAG: ${{ github.sha }}
      run: |
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
        docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
        echo "image=$ECR_REGISTRY/$EC_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT
          
    - name: Download current task definition 
      run: |
        aws ecs describe-task-definition \
         --task-definition ${{ env.ECS_TASK_DEFINITION_FAMILY }} \
         --query taskDefiniton > task-definition-json
        
    - name: Fill in the new image ID in the task definition 
      id: task-def
      uses: aws-actions/amazon-ecs-render-task-definition@v1
      with:
        task-definition: task-definition.json
        container-name: ${{ env.CONTAINER_NAME }}
        image: ${{ steps.build.image.outputs.image }}
            
    - name: Deploy to Amazon ECS
      uses: aws-actions/amazon-ecs-deploy-task-definition@v2
      with:
        task-definition: ${{ steps.task-def.outputs.task-definition }}
        service: ${{ env.ECS_SERVICE }}
        cluster: ${{ env.ECS_CLUSTER }}
        wait-for-service-stability: true








